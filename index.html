<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>G6 အချိန်ဇယား</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --navy: #08131f;
    --navy2: #0b2138;
    --green-dk: #0b2016;
    --green: #155230;
    --green-br: #38d68a;
    --green-sm: #2aa06a;
    --gold: #d4af37;
    --gold-s: #f0d272;
    --text: #ebf3ee;
    --muted: #86a896;
    --line: rgba(96,160,130,0.28);
    --card: #0e241c;
    --head: #0b1c26;
    --daycol: #0a1e16;
  }

  html, body { min-height:100%; }

  body {
    font-family: "Noto Sans Myanmar", "Padauk", "Myanmar Text", "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(1000px 560px at 90% -10%, rgba(42,160,106,0.18), transparent 55%),
      radial-gradient(900px 520px at -10% 110%, rgba(22,60,120,0.28), transparent 55%),
      linear-gradient(155deg, var(--green-dk) 0%, var(--navy) 58%, var(--navy2) 100%);
    background-attachment: fixed;
    padding-bottom: 48px;
  }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px 14px 0; }

  /* ---------- Header ---------- */
  header {
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom: 12px;
  }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .crest {
    flex:0 0 auto; width:56px; height:56px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family: Georgia, serif; font-size:20px; font-weight:800; color: var(--gold-s);
    background: radial-gradient(circle at 35% 28%, #21603f, var(--green-dk) 72%);
    border: 2px solid var(--gold);
    box-shadow: 0 0 20px rgba(212,175,55,0.3), inset 0 0 16px rgba(0,0,0,0.55);
    cursor:pointer; user-select:none;
    transition: transform .15s; animation: breath 3.5s ease-in-out infinite;
  }
  .crest:active { transform: scale(0.92); }
  @keyframes breath { 0%,100%{box-shadow:0 0 14px rgba(212,175,55,0.28), inset 0 0 16px rgba(0,0,0,0.55);} 50%{box-shadow:0 0 28px rgba(212,175,55,0.5), inset 0 0 16px rgba(0,0,0,0.55);} }

  .titles h1 { font-size:1.05rem; line-height:1.2; font-weight:800; color:var(--gold-s); }
  .titles .sub { font-size:.66rem; color:var(--muted); margin-top:2px; }

  .clock-box {
    text-align:right; background: rgba(5,16,26,0.55);
    border:1px solid var(--line); border-radius:14px; padding:8px 14px;
  }
  .clock-box .t {
    font-size:1.5rem; font-weight:800; line-height:1;
    font-variant-numeric: tabular-nums; font-family:"SF Mono","Cascadia Mono",Consolas,monospace;
  }
  .clock-box .t small { font-size:.72rem; font-weight:600; color:var(--gold); margin-left:2px; }
  .clock-box .meta { display:flex; justify-content:flex-end; gap:6px; margin-top:3px; }
  .clock-box .m { font-size:.58rem; color:var(--muted); }
  .clock-box .d { font-size:.62rem; color:var(--gold-s); font-weight:700; }

  /* ---------- Status ---------- */
  .statusbar {
    margin-bottom: 12px; border-radius:12px; padding:10px 12px;
    background: linear-gradient(90deg, rgba(21,82,48,0.45), rgba(11,33,56,0.55));
    border:1px solid var(--line);
    display:flex; align-items:center; gap:10px; font-size:.84rem;
  }
  .statusbar .pip {
    flex:0 0 auto; width:9px;height:9px;border-radius:50%;
    background: var(--green-br); box-shadow:0 0 10px var(--green-br); animation:pulse 1.7s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 45%{opacity:.2} }
  .statusbar .txt b { color: var(--gold-s); }
  .statusbar .led { margin-left:auto; font-size:.62rem; color:var(--gold); letter-spacing:.1em; display:none; }
  .statusbar .led.on { display:inline-block; }

  /* ---------- Matrix ---------- */
  .grid-scroll {
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    border:1px solid var(--line); border-radius:16px;
    background: rgba(5,14,24,0.5); padding:4px;
    scrollbar-width: thin; scrollbar-color: var(--green-sm) transparent;
  }
  .grid-scroll::-webkit-scrollbar { height:8px; }
  .grid-scroll::-webkit-scrollbar-thumb { background: var(--green-sm); border-radius:10px; }

  table.matrix { border-collapse:separate; border-spacing:6px; width:100%; min-width:780px; }

  table.matrix th, table.matrix td {
    padding:9px 8px; text-align:center; vertical-align:middle;
    border-radius:10px; font-size:.8rem; line-height:1.35;
  }
  table.matrix th, table.matrix td { overflow-wrap:anywhere; word-break:break-word; }
  table.matrix td { font-size:.76rem; }
  table.matrix thead th { font-size:.7rem; }

  /* header (time, horizontal) */
  table.matrix thead th {
    position:sticky; top:0; z-index:2;
    background: var(--head); border:1px solid var(--line);
    color: var(--gold-s); font-weight:800; font-size:.74rem; white-space:nowrap;
  }
  table.matrix thead th .st { display:block; font-size:.6rem; color:var(--muted); font-weight:500; font-variant-numeric:tabular-nums; }
  table.matrix thead th.lunchh { color: var(--muted); border-style:dashed; }
  table.matrix thead th.lunchh .st { color: var(--gold); }

  /* grid cells (subjects) */
  table.matrix td {
    background: var(--card); border:1px solid var(--line);
    font-weight:700;
  }
  table.matrix td.lza { border-style:dashed; color:var(--muted); font-weight:600; background: rgba(40,18,5,0.28); }

  /* day column (vertical) */
  table.matrix th.corner {
    position:sticky; left:0; top:0; z-index:4;
    background: #061218;
  }
  table.matrix td.day {
    position:sticky; left:0; z-index:1;
    background: var(--daycol); border:1px solid var(--line);
    min-width:104px; text-align:left; font-weight:800; color:var(--text); font-size:.82rem;
  }
  table.matrix td.day .ico { margin-right:5px; }

  /* today row + live column + cell */
  table.matrix tr.rtoday td.day { color: var(--gold-s); border-color: rgba(240,210,114,0.5); }
  table.matrix tr.rtoday td:not(.day){ background: rgba(21,82,48,0.30); }
  table.matrix td.colnow { background: rgba(42,160,106,0.36); }
  table.matrix td.cellnow {
    border:1.5px solid var(--gold);
    box-shadow: 0 0 0 1px var(--gold), 0 0 18px rgba(212,175,55,0.3);
    background: rgba(64,44,8,0.55);
  }
  table.matrix thead th.colnow { color: var(--green-br); background: #0a2a1a; }

  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; box-shadow:0 0 8px currentColor; }
  .c-geo{color:#f0a04b}.c-hist{color:#ef6a6a}.c-sci{color:#52e8a2}.c-my{color:#c3a9ff}
  .c-math{color:#5fb2ff}.c-eng{color:#4fd2e0}.c-art{color:#ff8ec9}.c-civ{color:#ffa457}
  .c-mus{color:#d9a4ff}.c-soc{color:#62e3b0}.c-hum{color:#ffcf5e}

  /* ---------- Test panel ---------- */
  .test-panel {
    margin-top:16px; border-radius:16px; padding:16px;
    background: linear-gradient(180deg, rgba(8,26,19,0.94), rgba(7,18,30,0.95));
    border:1px solid var(--line); box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  .test-panel[hidden] { display:none; }
  .tp-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .tp-head h2 { font-size:.9rem; color:var(--gold-s); letter-spacing:.1em; font-weight:800; }
  .tp-head .close { border:1px solid var(--line); background:none; color:var(--muted); width:30px;height:30px; border-radius:8px; font-size:.9rem; cursor:pointer; }
  .tp-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:8px; }
  @media (max-width:599px){ .tp-grid{ grid-template-columns:repeat(4,1fr);} }
  .pbtn { padding:9px 4px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-weight:700; font-size:.78rem; cursor:pointer; transition:all .15s; }
  .pbtn small { display:block; font-size:.58rem; color:var(--muted); font-weight:500; }
  .pbtn:active { background:var(--green); border-color:var(--green-br); transform:scale(.95); }
  .s-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .sbtn { flex:1; min-width:112px; padding:11px 8px; border-radius:11px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:.8rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px; transition:all .15s; }
  .sbtn:active { background:var(--green); border-color:var(--green-br); transform:scale(.96); }
  .timer-row { margin-top:14px; }
  .timer-row .lbl { display:flex; justify-content:space-between; font-size:.68rem; color:var(--muted); margin-bottom:6px; }
  .timer-row .lbl b { color:var(--gold-s); }
  .range { width:100%; accent-color:var(--green-br); }
  .mini-row { display:flex; gap:8px; margin-top:10px; }
  .mini { flex:1; padding:9px; border-radius:9px; border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--text); font-size:.74rem; cursor:pointer; font-weight:600; }
  .mini:active { background:var(--green); }
  .tp-hint { margin-top:12px; font-size:.62rem; color:var(--muted); line-height:1.7; }

  .toast { max-width:420px; margin:14px auto 0; text-align:center; color:var(--muted); font-size:.74rem; min-height:20px; }
  footer { text-align:center; margin-top:18px; font-size:.62rem; color:var(--muted); letter-spacing:.06em; }

  #unlock {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    background:linear-gradient(160deg, var(--gold), #b8912a); color:#131f18;
    border:none; border-radius:30px; padding:13px 24px; font-size:.88rem; font-weight:800;
    font-family:inherit; box-shadow:0 8px 26px rgba(0,0,0,.5); cursor:pointer; z-index:60; display:none;
  }

  /* test console opener button */
  #gear {
    position:fixed; right:14px; bottom:16px;
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(160deg, var(--green-sm), #0e3a26);
    border:2px solid var(--gold); color:var(--gold-s);
    font-size:22px; cursor:pointer; z-index:55;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s;
  }
  #gear:active { transform:scale(.9) rotate(40deg); }
  @media (max-width:599px){ #gear{ right:12px; bottom:12px; width:48px; height:48px; font-size:20px; } }

  /* always-visible error banner */
  #errbox {
    display:none; position:fixed; left:50%; top:10px; transform:translateX(-50%);
    width:min(96vw, 640px); max-height:42vh; overflow:auto;
    background:rgba(60,12,12,0.95); border:2px solid #ff6b6b; border-radius:10px;
    color:#ffd7d7; font-size:.72rem; line-height:1.5; padding:10px 12px;
    white-space:pre-wrap; word-break:break-word; font-family:monospace; z-index:300;
    box-shadow:0 8px 30px rgba(0,0,0,.6);
  }
  #errbox.on { display:block; }
  #errbox .tag { display:inline-block; background:#ff6b6b; color:#300; font-weight:800;
    font-size:.62rem; padding:1px 6px; border-radius:4px; margin-right:6px; }
</style>
</head>
<body>
<div id="errbox" role="alert"></div>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="crest" id="crest" title="စမ်းသပ်ကိရိယာဖွင့်ရန်">G6</div>
      <div class="titles">
        <h1>G6 အချိန်ဇယား</h1>
        <p class="sub">ဆဋ္ဌမတန်း &middot; မြန်မာစံတော်ချိန်</p>
      </div>
    </div>
    <div class="clock-box">
      <div class="t"><span id="clkH">--</span>:<span id="clkM">--</span><small id="clkMer"></small></div>
      <div class="meta"><span class="m" id="clkZone">MST</span><span class="d" id="clkDay">—</span></div>
    </div>
  </header>

  <div class="statusbar">
    <span class="pip"></span>
    <span class="txt" id="statusTxt">…</span>
    <span class="led" id="simLed">⏱ စမ်းသပ်အချိန်</span>
  </div>

  <!-- timetable matrix: days vertical, time horizontal -->
  <div class="grid-scroll" id="matrixWrap"></div>

  <!-- test console (hidden) -->
  <section class="test-panel" id="testPanel" hidden>
    <div class="tp-head">
      <h2>🔧 စမ်းသပ်ကိရိယာ</h2>
      <button class="close" id="closeTest" title="ပိတ်မည်">✕</button>
    </div>
    <div class="tp-grid" id="tpGrid"></div>
    <div class="s-btns">
      <button class="sbtn" data-sound="start"><span class="ic">🔔</span> ကျောင်းစ</button>
      <button class="sbtn" data-sound="anthem"><span class="ic">🎵</span> နိုင်ငံတော်သီချင်း</button>
      <button class="sbtn" data-sound="chimes"><span class="ic">⏰</span> နာရီသံ</button>
      <button class="sbtn" data-sound="bell"><span class="ic">🔔</span> ခေါင်းလောင်း</button>
      <button class="sbtn" data-sound="patriotic"><span class="ic">🇲🇲</span> ဇာတိမာန်သီချင်း</button>
    </div>
    <div class="timer-row">
      <div class="lbl"><span>⏱ အချိန်ရွှေ့ပြောင်းမှု (မိနစ်)</span><b id="offLbl">+0</b></div>
      <input type="range" class="range" id="offRange" min="-180" max="180" step="5" value="0">
    </div>
    <div class="mini-row">
      <button class="mini" id="mReal">လက်ရှိအချိန်</button>
      <button class="mini" id="mLunchS">နေ့လည် ၁၂:၀၀</button>
      <button class="mini" id="mLunchE">နေ့လည် ၁၂:၃၀</button>
      <button class="mini" id="mEnd">နေ့လည် ၃:၀၀</button>
    </div>
    <div class="tp-hint">
      🖱 ကွန်ပျူတာ: <b>Shift + Alt + 1</b> ဖွင့်/ပိတ် &middot; <b>Shift + 1…8</b> စာချိန်ခုန်ကျော်
      &middot; 📱 ဖုန်း: G6 လိုဂိုကို နှိပ်ပါ။
    </div>
  </section>

  <div class="toast" id="toast">ခေါင်းလောင်းမမြည်သေးပါ</div>
  <footer>G6 အချိန်ဇယား · မြန်မာစံတော်ချိန် · ၂၀၂၆</footer>
</div>

<button id="unlock">🔔 အသံဖွင့်ရန် နှိပ်ပါ</button>
<button id="gear" title="စမ်းသပ်ကိရိယာ">🔧</button><script>
"use strict";

/* ---------------- Audio ---------------- */
const SOUNDS = {
  anthem:    "audio/anthem.mp3",
  patriotic: "audio/patriotic.mp3",
  chimes:    "audio/westminster.mp3",
  bell:      "audio/bell.mp3"
};
const audio = {};
for (const k in SOUNDS) { audio[k] = new Audio(SOUNDS[k]); audio[k].preload = "auto"; }
let unlocked = false;

function doUnlock() {
  unlocked = true;
  document.getElementById("unlock").style.display = "none";
  for (const k in audio) {
    const p = audio[k].play();
    if (p !== undefined) p.then(() => audio[k].pause()).catch(() => {});
  }
}
document.getElementById("unlock").onclick = doUnlock;
document.addEventListener("pointerdown", () => { if (!unlocked) doUnlock(); });

/* ---------------- Always-visible error reporting ---------------- */
function showErr(msg) {
  const b = document.getElementById("errbox");
  if (!b) return;
  b.classList.add("on");
  const line = document.createElement("div");
  line.innerHTML = "<span class='tag'>ERROR</span>" + msg.replace(/</g,"&lt;");
  b.appendChild(line);
  console.error(msg);
}
window.addEventListener("error", function(ev){
  let s = (ev.message || "အမှား") + " · " + (ev.filename || "") + ":" + (ev.lineno || "?") + ":" + (ev.colno || "?");
  if (ev.error && ev.error.stack) s += "\n" + String(ev.error.stack).split("\n").slice(0,4).join("\n");
  showErr(s);
});
window.addEventListener("unhandledrejection", function(ev){
  showErr("Promise: " + (ev.reason && ev.reason.message || String(ev.reason)));
});

/* ---------------- Test console opener (gear) ---------------- */
const GEAR = document.getElementById("gear");
if (GEAR) GEAR.onclick = () => showTest(TEST.hidden ? false : true);

function stopAll() { for (const k in audio) { audio[k].pause(); audio[k].currentTime = 0; } }
function play(name, onEnd) {
  if (!unlocked) { toast("🔇 အသံဖွင့်ရန် နှိပ်ပါ"); return; }
  stopAll();
  const a = audio[name];
  a.currentTime = 0;
  a.onended = () => { if (onEnd) onEnd(); };
  a.play().catch(() => toast("🔇 အသံဖွင့်ရန် နှိပ်ပါ"));
}
function seq(list, i = 0) {
  if (i >= list.length) return;
  const [name, label] = list[i];
  toast("♪ " + label);
  play(name, () => seq(list, i + 1));
}

function playStartOfDay()  { seq([["bell","ခေါင်းလောင်း"],["anthem","နိုင်ငံတော်သီချင်း"],["bell","စတင်ရန်ခေါင်းလောင်း"]]); }
function playChimes()      { seq([["chimes","နာရီသံ"]]); }
function playLunchBell()   { seq([["bell","နားချိန်ခေါင်းလောင်း"]]); }
function playEndOfDay()    { seq([["bell","ခေါင်းလောင်း"],["bell","ခေါင်းလောင်း"],["patriotic","ဇာတိမာန်သီချင်း"],["bell","ခေါင်းလောင်း"]]); }

/* ---------------- Times ---------------- */
const PERIODS = [
  { n:1, s:540, e:585 },  // 9:00-9:45
  { n:2, s:585, e:630 },  // 9:45-10:30
  { n:3, s:630, e:660 },  // 10:30-11:00
  { n:4, s:660, e:690 },  // 11:00-11:30
  { n:5, s:690, e:720 },  // 11:30-12:00
  { n:6, s:750, e:795 },  // 12:30-13:15
  { n:7, s:795, e:870 },  // 13:15-14:30
  { n:8, s:870, e:900 }   // 14:30-15:00
];
const LUNCH = { s:720, e:750 };  // 12:00-12:30
const START_DAY = 8*60+55;       // 8:55
const END_DAY = 900;             // 15:00

const ORD = ["ပထမ","ဒုတိယ","တတိယ","စတုတ္ထ","ပဉ္စမ","ဆဋ္ဌမ","သတ္တမ","အဋ္ဌမ"];
const MYDAYS = ["တနင်္လာ","အင်္ဂါ","ဗုဒ္ဓဟူး","ကြာသပတေး","သောကြာ"];

function fmt(m) { const h=Math.floor(m/60), mm=m%60; return h+":"+String(mm).padStart(2,"0"); }
function mer(m) { const h=Math.floor(m/60); return h<12?"နံနက်":(h<18?"ညနေ":"ည"); }

/* ---------------- Data ---------------- */
const TIMETABLE = {
  "တနင်္လာ":    [["ပထဝီဝင်","c-geo"],["သမိုင်း","c-hist"],["သိပ္ပံ","c-sci"],["မြန်မာ","c-my"],["သင်္ချာ","c-math"],["သင်္ချာ","c-math"],["Cvics","c-civ"],["ပထဝီဝင်","c-geo"]],
  "အင်္ဂါ":      [["ပထဝီဝင်","c-geo"],["သမိုင်း","c-hist"],["သိပ္ပံ","c-sci"],["သင်္ချာ","c-math"],["Arts","c-art"],["သင်္ချာ","c-math"],["သိပ္ပံ","c-sci"],["ပထဝီဝင်","c-geo"]],
  "ဗုဒ္ဓဟူး":    [["ပထဝီဝင်","c-geo"],["မြန်မာ","c-my"],["သိပ္ပံ","c-sci"],["သင်္ချာ","c-math"],["Eng","c-eng"],["သင်္ချာ","c-math"],["Music","c-mus"],["ပထဝီဝင်","c-geo"]],
  "ကြာသပတေး":  [["ပထဝီဝင်","c-geo"],["မြန်မာ","c-my"],["သိပ္ပံ","c-sci"],["Eng","c-eng"],["Eng","c-eng"],["Socials","c-soc"],["Humanitration","c-hum"],["ပထဝီဝင်","c-geo"]],
  "သောကြာ":     [["ပထဝီဝင်","c-geo"],["သိပ္ပံ","c-sci"],["Eng","c-eng"],["မြန်မာ","c-my"],["Eng","c-eng"],["မြန်မာ","c-my"],["သမိုင်း","c-hist"],["ပထဝီဝင်","c-geo"]]
};
const DAYLIST = Object.keys(TIMETABLE);

/* ---------------- Clock (Myanmar Standard Time) ---------------- */
let simOffset = 0;

function realNow() {
  const f = new Intl.DateTimeFormat("en-GB", { timeZone:"Asia/Yangon", hour:"2-digit", minute:"2-digit", hour12:false });
  const [hh,mm] = f.format(new Date()).split(":");
  return (+hh % 24)*60 + +mm;
}
function todayIdx() {
  const map = { Mon:0, Tue:1, Wed:2, Thu:3, Fri:4 };
  const wd = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Yangon",weekday:"short"}).format(new Date());
  return map[wd] !== undefined ? map[wd] : -1;
}
const nowMin = () => ((realNow() + simOffset) % 1440 + 1440) % 1440;

/* ---------------- Status logic ---------------- */
function classify(m) {
  if (m < START_DAY) return { k:"before" };
  for (let i=0;i<PERIODS.length;i++){ if (m>=PERIODS[i].s && m<PERIODS[i].e) return { k:"in", i }; }
  if (m>=LUNCH.s && m<LUNCH.e) return { k:"lunch" };
  if (m>=END_DAY) return { k:"after" };
  return { k:"gap" };
}

/* ---------------- Event engine ---------------- */
let fired = {};

const EVENTS = [
  { at:START_DAY, key:"start", fn:playStartOfDay },
  { at:585, key:"e1", fn:playChimes },
  { at:630, key:"e2", fn:playChimes },
  { at:660, key:"e3", fn:playChimes },
  { at:690, key:"e4", fn:playChimes },
  { at:720, key:"ls", fn:playLunchBell },
  { at:750, key:"le", fn:playLunchBell },
  { at:795, key:"e6", fn:playChimes },
  { at:870, key:"e7", fn:playChimes },
  { at:900, key:"end", fn:playEndOfDay }
];

function fireDue() {
  if (todayIdx() < 0) return;
  const m = nowMin();
  for (const e of EVENTS) {
    if (m >= e.at && !fired[e.key]) { fired[e.key] = true; e.fn(); }
  }
}
function resetFired() { fired = {}; }

/* ---------------- Matrix render: days vertical, time horizontal ---------------- */
const WRAP = document.getElementById("matrixWrap");

/* column order: P1..P5, lunch, P6..P8 */
function colSpan(i) {
  if (i <= 4) return { ord:ORD[i], sfx:fmt(PERIODS[i].s) };
  if (i === 5) return { ord:"နားချိန်", sfx:"🍚 ၁၂:၀၀–၁၂:၃၀" };
  return { ord:ORD[i], sfx:fmt(PERIODS[i-1].s) };
}

function renderMatrix() {
  const tIdx = todayIdx();
  const m = nowMin();
  const st = classify(m);

  /* current column (0..8) */
  let cur = -1;
  if (st.k === "in") cur = st.i <= 4 ? st.i : st.i + 1;   // P6..P8 -> col 5+...+1
  else if (st.k === "lunch") cur = 5;

  let html = "<table class='matrix'><thead><tr>";
  html += "<th class='corner'>နေ့</th>";
  for (let c=0;c<9;c++) {
    const cs = colSpan(c);
    const cls = "st" + (c===5 ? " lunchh" : "") + (c===cur ? " colnow" : "");
    html += `<th class="${cls}">${cs.ord}<span class="st">${cs.sfx}</span></th>`;
  }
  html += "</tr></thead><tbody>";

  DAYLIST.forEach((d, r) => {
    const t = r === tIdx;
    html += `<tr class="${t ? "rtoday" : ""}">`;
    html += `<td class="day">${t ? "◉ " : ""}${d}</td>`;
    for (let c=0;c<9;c++) {
      if (c === 5) {
        html += `<td class="lza ${c===cur && t ? "cellnow" : ""}">🍚 ၁၂:၀၀–၁၂:၃၀</td>`;
        continue;
      }
      const pi = c <= 4 ? c : c - 1;
      const [name, cl] = TIMETABLE[d][pi];
      const now = (c===cur && t) ? " cellnow" : "";
      const colnow = (c===cur) ? " colnow" : "";
      html += `<td class="${now}${colnow}"><span class="dot ${cl}"></span>${name}</td>`;
    }
    html += "</tr>";
  });

  html += "</tbody></table>";
  WRAP.innerHTML = html;

  /* status */
  const tb = document.getElementById("statusTxt");
  document.getElementById("simLed").className = "led" + (simOffset ? " on" : "");
  if (tIdx < 0) tb.innerHTML = "ပိတ်ရက် ဖြစ်ပါသည် — စာချိန်မရှိပါ";
  else if (st.k === "before") tb.innerHTML = "ကျောင်းမစသေးပါ · နောက်ခေါင်းလောင်း <b>" + fmt(START_DAY) + "</b>";
  else if (st.k === "in") tb.innerHTML = "စာချိန် <b>" + ORD[st.i] + "</b> သင်နေသည် · ဆုံး <b>" + fmt(PERIODS[st.i].e) + "</b>";
  else if (st.k === "lunch") tb.innerHTML = "<b>နေ့လည်စာ နားချိန်</b> · " + (LUNCH.e - m) + " မိနစ်အကြာ ပြန်တက်ရမည်";
  else if (st.k === "after") tb.innerHTML = "ကျောင်းပြီးပါပြီ ✔";
  else tb.innerHTML = "စာချိန်ကြားတွင် နားချိန်";
}

/* ---------------- Test console ---------------- */
const TEST = document.getElementById("testPanel");
function showTest(on) { TEST.hidden = !on; }
document.getElementById("crest").onclick = () => showTest(TEST.hidden);
document.getElementById("closeTest").onclick = () => showTest(false);

document.addEventListener("keydown", e => {
  if (e.shiftKey && e.altKey && e.key === "1") { showTest(TEST.hidden); return; }
  if (e.shiftKey && !e.altKey && e.key >= "1" && e.key <= "8") jumpTo(+e.key - 1);
});

function jumpTo(i) {
  const p = PERIODS[i];
  simOffset = p.s - realNow();
  normalize();
  document.getElementById("offRange").value = clamp(simOffset);
  resetFired();
  refresh();
  const trig = [playStartOfDay, playChimes, playChimes, playChimes,
                playChimes, playLunchBell, playChimes, playChimes];
  trig[i]();
}

const GRID = document.getElementById("tpGrid");
for (let i=0;i<8;i++) {
  const b = document.createElement("button");
  b.className = "pbtn";
  b.innerHTML = `${ORD[i]}<small>${fmt(PERIODS[i].s)}</small>`;
  b.onclick = () => jumpTo(i);
  GRID.appendChild(b);
}

document.querySelectorAll(".sbtn").forEach(b => {
  b.onclick = () => {
    const s = b.dataset.sound;
    if (s === "start") playStartOfDay();
    else if (s === "anthem") seq([["anthem","နိုင်ငံတော်သီချင်း"]]);
    else if (s === "chimes") playChimes();
    else if (s === "bell") playLunchBell();
    else if (s === "patriotic") seq([["patriotic","ဇာတိမာန်သီချင်း"]]);
  };
});

const OFF = document.getElementById("offRange");
OFF.oninput = () => { simOffset = +OFF.value; resetFired(); refresh(); };
function clamp(v){ return Math.max(-180, Math.min(180, v)); }
function normalize(){ while(simOffset>180) simOffset-=1440; while(simOffset<-180) simOffset+=1440; }
function setSim(target, playNow) {
  simOffset = target - realNow();
  normalize();
  OFF.value = clamp(simOffset);
  resetFired(); refresh();
  if (playNow) playNow();
}
document.getElementById("mReal").onclick = () => { OFF.value=0; simOffset=0; resetFired(); refresh(); };
document.getElementById("mLunchS").onclick = () => setSim(720);
document.getElementById("mLunchE").onclick = () => setSim(750);
document.getElementById("mEnd").onclick   = () => setSim(900, playEndOfDay);

/* ---------------- Clock / toast / loop ---------------- */
function refreshClock() {
  const m = nowMin();
  document.getElementById("clkH").textContent = Math.floor(m/60);
  document.getElementById("clkM").textContent = String(m%60).padStart(2,"0");
  document.getElementById("clkMer").textContent = " " + mer(m);
  document.getElementById("clkDay").textContent = todayIdx() >= 0 ? MYDAYS[todayIdx()] : "ပိတ်ရက်";
  document.getElementById("offLbl").textContent = (simOffset>0?"+":"") + simOffset + " မိနစ်";
}

function toast(msg) { document.getElementById("toast").textContent = msg; }

function refresh() {
  try {
    refreshClock();
    renderMatrix();
    fireDue();
  } catch (e) {
    showErr("refresh: " + (e.message || e) + (e && e.stack ? "\n" + String(e.stack).split("\n").slice(0,3).join("\n") : ""));
  }
}

window.addEventListener("resize", renderMatrix);
refresh();
setInterval(refresh, 1000);
</script>
